name: Release Notes Automation

on:
  push:
    branches:
      - main  # This triggers the action whenever you push to the `main` branch.

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Checks out your code so it can be used in subsequent steps

    - name: Set up Git
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'  # Set up the environment for the script

    - name: Generate release notes
      run: |
        python -m pip install --upgrade pip
        pip install release-notes-generator
        release-notes-generator --output CHANGELOG.md  # This automatically generates the changelog and writes it to CHANGELOG.md
          
    - name: Commit and push changes (if new changelog was created)
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add CHANGELOG.md
        git commit -m "Update changelog"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub token to authenticate commits
